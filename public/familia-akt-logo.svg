<!-- bold side-profile motorcycle -->
<g stroke-linecap="round" stroke-linejoin="round">
<!-- wheels -->
<circle cx="151" cy="285" r="48" fill="#07111f" stroke="#f0f7ff" stroke-width="9"/>
