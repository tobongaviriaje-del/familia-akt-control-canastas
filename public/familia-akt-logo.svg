<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Familia AKT — moto NKD con canasta</title><desc id="desc">Logo azul eléctrico con motocicleta de perfil cargando una canasta de mercado.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#092858"/><stop offset="1" stop-color="#020712"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#31d5ff"/><stop offset="1" stop-color="#0765ff"/></linearGradient><linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#8fa9ca"/></linearGradient></defs>
<circle cx="256" cy="256" r="249" fill="url(#bg)" stroke="#087cff" stroke-width="8"/>
