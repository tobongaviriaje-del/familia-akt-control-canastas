<text x="256" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="50" font-weight="900" font-style="italic" fill="#fff" stroke="#087cff" stroke-width="2">Familia</text>
<text x="256" y="416" text-anchor="middle" font-family="Arial,sans-serif" font-size="69" font-weight="900" font-style="italic" fill="url(#steel)" stroke="#086cff" stroke-width="2">AKT</text>
<path d="M84 432h344" stroke="#08baff" stroke-width="5"/>
<text x="256" y="459" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="800" letter-spacing="2" fill="#fff">CONTROL DE CANASTAS</text>
