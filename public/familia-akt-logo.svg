<circle cx="151" cy="285" r="8" fill="#fff"/>
<circle cx="363" cy="285" r="48" fill="#07111f" stroke="#f0f7ff" stroke-width="9"/>
<circle cx="363" cy="285" r="30" fill="#0b2d61" stroke="#13baff" stroke-width="6"/>
<circle cx="363" cy="285" r="8" fill="#fff"/>
