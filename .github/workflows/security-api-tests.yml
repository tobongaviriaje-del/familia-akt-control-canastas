name: Security API isolated tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [seguridad-api-2026]
jobs:
  security-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/security-api.test.js tests/reference-photos.test.js
