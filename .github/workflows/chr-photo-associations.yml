name: CHR photo association regression
on:
  push:
    branches: [fix/patinador-codigo-por-lote]
  pull_request:
    branches: [main]
jobs:
  chr-photo-associations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server syntax
        run: node --check server.js
      - name: Parse inline scripts in index.html
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)];
          if (!scripts.length) throw new Error('No inline scripts found in public/index.html');
          let checked = 0;
          for (const [index, match] of scripts.entries()) {
            const source = match[1].trim();
            if (!source) continue;
            try { new Function(source); checked++; }
            catch (error) { throw new Error('Inline script ' + (index + 1) + ': ' + error.message); }
          }
          console.log('Parsed ' + checked + ' inline script(s).');
          NODE
      - name: Verify CHR photo associations
        run: node --test tests/chr-photos.test.js
