name: Validate AKT syntax

on:
  push:
    branches:
      - main
      - feature/paneles-por-perfil
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate server and browser JavaScript
        run: node scripts/check-syntax.js
