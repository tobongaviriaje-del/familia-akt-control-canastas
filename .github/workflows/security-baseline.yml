name: Security baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/full-hardening, fix/role-safe-saves]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated server tests
        run: npm test
